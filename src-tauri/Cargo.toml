[package]
name = "vibe-curator"
version = "0.1.0"
description = "The native wallpaper player for Vibe Curator"
authors = ["Vibe Curator"]
edition = "2021"

[lib]
name = "vibe_curator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
