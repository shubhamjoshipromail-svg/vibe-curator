<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vibe Curator</title>
    <link rel="stylesheet" href="./ui.css">
  </head>
  <body class="popup-page">
    <main class="popup-shell">
      <header class="popup-brand"><span class="brand-mark">V</span><span>Vibe Curator</span></header>
      <div class="popup-scene">
        <span>Current scene</span>
        <strong id="scene-name">Signal Drift</strong>
        <small id="scene-style">procedural</small>
      </div>
      <button class="primary wide" id="enable-sound">Enable sound</button>
      <button class="primary wide" id="toggle-play" hidden>Play</button>
      <label class="volume-row" for="volume"><span>Master volume</span><output id="volume-output">80%</output></label>
      <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8">
      <a class="customize-link" id="customize" target="_blank" rel="noreferrer">Customize visuals &amp; audio in Labs</a>
      <p class="status popup-status" id="status" role="status"></p>
    </main>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
