<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>New Tab</title>
    <link rel="stylesheet" href="./ui.css">
  </head>
  <body class="newtab-page">
    <main class="vibe-stage" id="stage">
      <img class="scene-image" id="scene-image" alt="">
      <div class="scene-wash" aria-hidden="true"></div>
      <div class="ambient-orb orb-one" aria-hidden="true"></div>
      <div class="ambient-orb orb-two" aria-hidden="true"></div>
      <nav class="google-shortcuts" aria-label="Google shortcuts">
        <a href="https://mail.google.com/mail/u/0/" rel="noreferrer">Gmail</a>
        <a href="https://images.google.com/" rel="noreferrer">Images</a>
        <a class="google-icon-link" href="https://www.google.com/intl/en/about/products" rel="noreferrer" aria-label="Google apps" title="Google apps"><span class="apps-grid" aria-hidden="true"></span></a>
        <a class="google-icon-link account-link" href="https://myaccount.google.com/" rel="noreferrer" aria-label="Google Account" title="Google Account"><span class="account-glyph" aria-hidden="true"></span></a>
      </nav>
      <section class="scene-copy" aria-live="polite">
        <p class="eyebrow" id="scene-style">PROCEDURAL</p>
        <h1 id="scene-name">Signal Drift</h1>
        <p id="scene-description">Weightless and deep. Nothing to look at directly.</p>
      </section>
      <section class="sound-card" id="sound-card">
        <div class="sound-copy"><strong id="sound-title">Sound is off</strong><span id="sound-detail">One click enables this vibe's audio on this device.</span></div>
        <label class="vibe-volume" for="vibe-volume">
          <span><span>Vibe volume</span><output id="vibe-volume-output">80%</output></span>
          <input id="vibe-volume" type="range" min="0" max="1" step="0.01" value="0.8">
        </label>
        <button class="primary" id="enable-sound">Enable sound</button>
        <button class="icon-button" id="toggle-play" hidden aria-label="Play ambient sound">▶</button>
      </section>
      <p class="status" id="status" role="status"></p>
    </main>
    <script type="module" src="./newtab.ts"></script>
  </body>
</html>
